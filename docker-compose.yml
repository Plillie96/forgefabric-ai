version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: forgefabric
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      - postgres
    ports:
      - "7233:7233"
      - "8080:8080"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PWD: pass
      POSTGRES_SEEDS: postgres

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    command: run --server /policies
    volumes:
      - ./backend/src/governance/policies:/policies

volumes:
  pgdata: